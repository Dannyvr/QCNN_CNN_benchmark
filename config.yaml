# =============================================================================
# BENCHMARK QCNN vs BASELINES CLÁSICOS — CONFIGURACIÓN ÚNICA
# -----------------------------------------------------------------------------
# Punto de entrada único:
#     .venv\Scripts\python.exe main.py                      # usa este archivo
#     .venv\Scripts\python.exe main.py --config otro.yaml   # config alternativa
#     .venv\Scripts\python.exe main.py --report-only results\<run>  # solo reporte
#
# Todo el comportamiento (modo, tareas, tamaños, presupuestos, semillas,
# hiperparámetros, estadística y gráficos) se define aquí.
# =============================================================================

run:
  # Modo experimental (ver sección `modes`):
  #   pilot        -> validación rápida de extremo a extremo (todas las figuras)
  #   data_size    -> solo barrido de cantidad de imágenes N_train (T fijo)
  #   param_budget -> solo barrido de presupuesto de parámetros T (N fijo)
  #   grid         -> barrido cruzado completo N_train x T
  mode: grid

  # Tareas evaluadas en la MISMA corrida (comparación lado a lado en figuras)
  tasks: [mnist_01]

  # Modelos a evaluar. Variacionales (dependen de T): QCNN, CNN_Matched, MLP_Compact
  # Fijos (no dependen de T): Logistic_Regression, SVM_Linear, SVM_RBF, CNN_Full
  models: [QCNN, CNN_Matched, MLP_Compact, Logistic_Regression, SVM_Linear, SVM_RBF, CNN_Full]

  results_dir: ./results
  run_name: null      # null => "<modo>_<timestamp>". Fijar un nombre para reanudar
  resume: true        # Omite combinaciones (tarea, N, semilla, T, modelo) ya guardadas
  n_jobs: 1           # Procesos paralelos; cada job = tarea x N x semilla. -1 = todos los núcleos
  log_level: INFO

# Listas de semillas reutilizables (anclas YAML)
seed_sets:
  pilot: &seeds_pilot [42, 123, 999]
  full: &seeds_full [42, 101, 202, 303, 404, 505, 606, 707, 808, 909, 1111, 2222, 3333, 4444, 5555]

modes:
  pilot:
    description: "Piloto: valida el pipeline completo con pocas semillas y épocas reducidas"
    train_sizes: [20, 50]
    budgets: [15, 45]
    seeds: *seeds_pilot
    epochs_scale: 0.5          # Multiplica las épocas de cada modelo

  data_size:
    description: "Curvas de aprendizaje: exactitud vs N_train con T fijo"
    train_sizes: [10, 20, 50, 100, 200, 500]
    budgets: [45]
    seeds: *seeds_full
    epochs_scale: 1.0

  param_budget:
    description: "Eficiencia paramétrica: exactitud vs T con N_train fijo"
    train_sizes: [50]
    budgets: [15, 30, 45, 90]
    seeds: *seeds_full
    epochs_scale: 1.0

  grid:
    description: "Barrido cruzado completo N_train x T (identifica puntos de cruce)"
    train_sizes: [10, 20, 50, 100, 200, 500]
    budgets: [15, 30, 45, 90]
    seeds: *seeds_full
    epochs_scale: 1.0

tasks:
  mnist_01:
    classes: [0, 1]
    description: "Alta separabilidad geométrica (validación inicial)"
  mnist_38:
    classes: [3, 8]
    description: "Alto solape morfológico no lineal (tarea difícil)"

data:
  data_dir: ./data
  splits_dir: ./data/splits
  test_size: 1000       # Test estático balanceado (500 por clase), aislado hasta la evaluación
  val_size: 200         # Validación fija balanceada; se usa SOLO para seleccionar la mejor época
  split_seed: 42        # Semilla de la partición estática (independiente de las semillas de corrida)

preprocessing:
  pca_components: 8     # = número de qubits del encoding por ángulos
  scaler: standard      # standard | minmax (ajustado únicamente con train de cada corrida)
  quantum_angle_range: 0_to_pi   # 0_to_pi | minus_pi_to_pi | minmax_clip

training:
  select_best_on_val: true   # Early-model-selection: restaura la época con mejor exactitud en validación
  eval_batch_size: 256

models:
  QCNN:
    device: default.qubit    # default.qubit | lightning.qubit
    n_qubits: 8
    init_scale: 0.785398     # Pesos iniciales ~ U(-pi/4, pi/4) para mitigar barren plateaus
    lr: 0.05
    epochs: 35
    batch_size: 16
    weight_decay: 0.0
  CNN_Matched:
    lr: 0.01
    epochs: 40
    batch_size: 16
    weight_decay: 0.0001
  MLP_Compact:
    lr: 0.01
    epochs: 40
    batch_size: 16
    weight_decay: 0.0
  CNN_Full:                  # Techo de referencia sobre imágenes 28x28 (~26.4k parámetros)
    conv1_channels: 8
    conv2_channels: 16
    fc_dim: 32
    dropout: 0.2
    lr: 0.001
    epochs: 25
    batch_size: 32
    weight_decay: 0.0
  Logistic_Regression:
    C: 1.0
    max_iter: 1000
  SVM_Linear:
    C: 1.0
  SVM_RBF:
    C: 1.0
    gamma: scale

statistics:
  confidence_level: 0.95
  reference_model: QCNN
  # Comparaciones pareadas por semilla (Wilcoxon signed-rank) contra el modelo de referencia
  comparisons: [CNN_Matched, MLP_Compact, Logistic_Regression, SVM_RBF, CNN_Full]
  correction: holm           # holm | bonferroni | none (aplicada sobre toda la familia de pruebas)
  alpha: 0.05

plots:
  dpi: 600
  reference_budget: 45       # T usado en curvas de aprendizaje (se toma el más cercano disponible)
  reference_train_size: 50   # N usado en gráficos a N fijo (se toma el más cercano disponible)
